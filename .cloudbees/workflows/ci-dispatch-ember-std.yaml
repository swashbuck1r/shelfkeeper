apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci-dispatch-ember-std

# Twin of ci-dispatch-ember.yaml that requests ember-runner's generic
# stdlib-warm L1 template via the ember-std selector label
# (ember-runner feature 004, D-004.1: label matching is runner ⊇ job,
# so the serving registration carries [ember, ember-std] and this
# job's labels select the template per job). Everything else is
# identical to ci-dispatch-ember.yaml, including the all-`run:`
# constraint and the comparability caveat recorded there.
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: ''
      result_url:
        type: string
        default: ''

jobs:
  build:
    runs-on: [ember, ember-std]
    timeout-minutes: 30
    steps:
      - name: checkout
        run: |
          git clone --depth 1 --branch main https://github.com/swashbuck1r/shelfkeeper .
          git log -1 --format='checkout %H'
      - name: build
        env:
          CIBENCH_RUN_ID_INPUT: ${{ inputs.run_id }}
          CIBENCH_RESULT_URL: ${{ inputs.result_url }}
        run: |
          CIBENCH_RUN_ID="${CIBENCH_RUN_ID_INPUT}" ./ci/bench.sh
