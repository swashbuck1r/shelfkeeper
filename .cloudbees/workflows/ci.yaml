apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci

# Push-triggered build. The manually/API-triggered variant lives in ci-dispatch.yaml because
# the `inputs` context is undefined on push events and any reference to it fails evaluation.
on:
  push:
    branches:
      - 'bench/unify/**'
      - 'bench/all/**'

jobs:
  build:
    timeout-minutes: 30
    steps:
      - uses: https://github.com/cloudbees-io/checkout@caf1644f1bd9fdc807b124078470c4407fc0075f # v2.2
      - name: build
        uses: docker://buildpack-deps:noble-scm@sha256:8d9e6fd4c0c302d5e572914da14bd6b2c8bc536a4559ef2cc5efd94e8ea59caa
        shell: bash
        env:
          CIBENCH_BRANCH: ${{ cloudbees.scm.branch }}
        run: |
          CIBENCH_RUN_ID="${CIBENCH_BRANCH##*/}" ./ci/bench.sh
